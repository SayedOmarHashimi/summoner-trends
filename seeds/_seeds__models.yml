version: 2

seeds:
  - name: champion_static
    description: >
      Champion reference data from Data Dragon. Regenerate with
      `python -m extraction.fetch_static_data` after a patch; the file is
      committed so `dbt build` works without network access (CI relies on this).
    config:
      column_types:
        champion_id: integer
    columns:
      - name: champion_id
        tests: [not_null, unique]
      - name: champion_key
        tests: [not_null, unique]
      - name: champion_name
        tests: [not_null]
